[build]
  command = "npm run build"
  publish = "dist"

# PWA : le service worker et le manifest ne doivent jamais être mis en cache
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# Assets buildés (hashés) : cache long, immuable
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fallback SPA : toutes les routes servent index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Secrets scanning : ne pas scanner la doc (les exemples de noms de variables y sont volontairement cités)
# et ne jamais scanner les MP3. SECRETS_SCAN_OMIT_PATHS est la bonne pratique Netlify officielle.
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "docs/**,*.md,public/audio/**"
  SECRETS_SCAN_OMIT_KEYS = "AUTH_SECRET,SITE_PASSWORD,MISTRAL_API_KEY,MISTRAL_TTS_VOICE"
